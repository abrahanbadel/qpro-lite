<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reportes · QPro Lite</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <header>
    <a href="index.html">← Inicio</a>
    <h1>Reporte de ventas</h1>
    <p>Total vendido, pedidos cobrados y ticket promedio del día.</p>
  </header>

  <main>
    <div id="aviso" class="aviso" role="status"></div>
    <form id="consulta" class="barra">
      <label>Fecha <input type="date" id="fecha" required></label>
      <button type="submit">Consultar</button>
    </form>
    <table>
      <thead>
        <tr><th>Total vendido</th><th>Pedidos cobrados</th><th>Ticket promedio</th></tr>
      </thead>
      <tbody>
        <tr><td id="total" class="total"></td><td id="pedidos"></td><td id="ticket"></td></tr>
      </tbody>
    </table>
  </main>

  <footer id="pie"></footer>
  <script src="comun.js"></script>
  <script src="reportes.js"></script>
</body>
</html>
