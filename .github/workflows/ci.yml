name: CI

# El pipeline se ejecuta con cada push y cada pull request hacia las ramas protegidas.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Si llega un commit nuevo a la misma rama, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Instalar dependencias
        run: dotnet restore

      - name: Verificar formato del código (lint)
        run: dotnet format --verify-no-changes --no-restore

      - name: Compilar
        run: dotnet build --no-restore --configuration Release

      - name: Pruebas unitarias
        run: dotnet test --no-build --configuration Release --filter "Categoria=Unitaria"

      - name: Pruebas funcionales
        run: dotnet test --no-build --configuration Release --filter "Categoria=Funcional"

      - name: Pruebas de integración
        run: dotnet test --no-build --configuration Release --filter "Categoria=Integracion"

      - name: Reporte de cobertura
        run: >
          dotnet test --no-build --configuration Release
          -p:CollectCoverage=true
          -p:CoverletOutputFormat=cobertura
          -p:CoverletOutput=../../coverage/

      - name: Publicar reporte de cobertura
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: coverage/

  docker:
    name: Construir imagen Docker
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Construir la imagen
        run: docker build --tag qpro-lite:${{ github.sha }} .

      - name: Probar que el contenedor arranca
        run: |
          docker run --detach --name qpro-lite --publish 8080:8080 qpro-lite:${{ github.sha }}
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8080/health
          curl --fail http://localhost:8080/api/version
          docker stop qpro-lite
